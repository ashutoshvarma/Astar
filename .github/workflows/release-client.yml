name: openssl-sys aarch64 – working Jammy run

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04        # jammy runner

    env:
      PKG_CONFIG_ALLOW_CROSS: "1"
      OPENSSL_DIR:         /usr/lib/aarch64-linux-gnu
      OPENSSL_LIB_DIR:     /usr/lib/aarch64-linux-gnu
      OPENSSL_INCLUDE_DIR: /usr/include/aarch64-linux-gnu
      RUST_BACKTRACE: 1
      CARGO_TERM_VERBOSE: true

    steps:
    # ─── 1. Rewrite sources: amd64 → normal mirrors, arm64 → ports ─────────
      - name: Rewrite APT sources for multi-arch
        run: |
          sudo dpkg --add-architecture arm64

          # add [arch=amd64] to every repo line that lacks an [arch=...] tag
          sudo sed -i '/^deb /{/\[arch=/! s/^deb /deb [arch=amd64] /}' /etc/apt/sources.list

          # add ports.ubuntu.com for arm64
          CODENAME=$(lsb_release -sc)
          sudo tee /etc/apt/sources.list.d/ports-arm64.list > /dev/null <<EOF
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $CODENAME          main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $CODENAME-updates  main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $CODENAME-security main restricted universe multiverse
          EOF

          sudo apt-get update


    # ─── 2. Install cross tool-chain & OpenSSL sysroot ─────────────────────
      - name: Install aarch64 tool-chain & libssl-dev:arm64
        run: |
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libc6-dev:arm64 zlib1g-dev:arm64 libssl-dev:arm64 \
            pkg-config

    # ─── 3. Add aarch64-aware pkg-config wrapper ───────────────────────────
      - name: pkg-config wrapper
        run: |
          echo -e '#!/usr/bin/env bash\nPKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu exec pkg-config "$@"' \
            | sudo tee /usr/local/bin/aarch64-linux-gnu-pkg-config
          sudo chmod +x /usr/local/bin/aarch64-linux-gnu-pkg-config

    # ─── 4. Cargo cross target config ──────────────────────────────────────
      - name: Configure Cargo
        run: |
          mkdir -p .cargo
          cat > .cargo/config <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker     = "aarch64-linux-gnu-gcc"
          pkg-config = "aarch64-linux-gnu-pkg-config"
          EOF
          rustup target add aarch64-unknown-linux-gnu

    # ─── 5. Minimal crate (openssl-sys only) and build ─────────────────────
      - name: Create demo crate
        run: |
          mkdir demo && cd demo
          cat > Cargo.toml <<'TOML'
          [package]
          name    = "openssl-sys-demo"
          version = "0.1.0"
          edition = "2021"
          [dependencies]
          openssl-sys = "0.9.108"
          TOML
          mkdir src && echo "fn main() {}" > src/main.rs

      - name: Build openssl-sys for aarch64
        working-directory: demo
        run: cargo build --target aarch64-unknown-linux-gnu -p openssl-sys --verbose
