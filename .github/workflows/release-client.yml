name: CI – openssl-sys aarch64 cross-build

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build-openssl-sys-aarch64:
    # GitHub-hosted runner (Ubuntu 24.04 as of May 2025)
    runs-on: ubuntu-latest

    env:
      RUST_BACKTRACE: 1
      CARGO_TERM_VERBOSE: true
      PKG_CONFIG_ALLOW_CROSS: "1"
      OPENSSL_DIR:         /usr/lib/aarch64-linux-gnu
      OPENSSL_LIB_DIR:     /usr/lib/aarch64-linux-gnu
      OPENSSL_INCLUDE_DIR: /usr/include/aarch64-linux-gnu

    steps:
    # ──────────────────────────────────────────────────────────────────────
    # 1.  Enable arm64 architecture and point it at ports.ubuntu.com
    # ──────────────────────────────────────────────────────────────────────
      - name: Add arm64 arch & redirect its mirrors to ports.ubuntu.com
        run: |
          sudo dpkg --add-architecture arm64

          # Restrict existing lines to amd64 so they don't 404 for arm64
          sudo sed -Ei 's|^deb (http.*ubuntu) |deb [arch=amd64] \1 |' /etc/apt/sources.list

          CODENAME=$(lsb_release -sc)     # 'noble' on ubuntu-latest now

          # Add explicit arm64 mirror entries on ports.ubuntu.com
          cat <<EOF | sudo tee /etc/apt/sources.list.d/ubuntu-ports-arm64.list
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $CODENAME          main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $CODENAME-updates  main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $CODENAME-security main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $CODENAME-backports main restricted universe multiverse
          EOF

          sudo apt update

    # ──────────────────────────────────────────────────────────────────────
    # 2.  Install cross compiler, sysroot & OpenSSL dev files (arm64)
    # ──────────────────────────────────────────────────────────────────────
      - name: Install tool-chain and OpenSSL for arm64
        run: |
          sudo apt install -y \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libc6-dev:arm64 zlib1g-dev:arm64 libssl-dev:arm64 \
            pkg-config

    # ──────────────────────────────────────────────────────────────────────
    # 3.  Provide an arm64-aware pkg-config wrapper
    # ──────────────────────────────────────────────────────────────────────
      - name: Add aarch64-linux-gnu-pkg-config wrapper
        run: |
          echo -e '#!/usr/bin/env bash\nPKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu exec pkg-config "$@"' \
            | sudo tee /usr/local/bin/aarch64-linux-gnu-pkg-config
          sudo chmod +x /usr/local/bin/aarch64-linux-gnu-pkg-config

    # ──────────────────────────────────────────────────────────────────────
    # 4.  Configure Cargo for the cross target
    # ──────────────────────────────────────────────────────────────────────
      - name: Configure Cargo target
        run: |
          mkdir -p .cargo
          cat > .cargo/config <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker     = "aarch64-linux-gnu-gcc"
          pkg-config = "aarch64-linux-gnu-pkg-config"
          EOF

      - name: Add Rust aarch64 target
        run: rustup target add aarch64-unknown-linux-gnu

    # ──────────────────────────────────────────────────────────────────────
    # 5.  Minimal demo crate that depends only on openssl-sys
    # ──────────────────────────────────────────────────────────────────────
      - name: Create minimal project
        run: |
          mkdir demo && cd demo
          cat > Cargo.toml <<'TOML'
          [package]
          name    = "openssl-sys-demo"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          openssl-sys = "0.9.108"
          TOML

          mkdir src && echo "fn main() {}" > src/main.rs

    # ──────────────────────────────────────────────────────────────────────
    # 6.  Build just the openssl-sys crate for aarch64
    # ──────────────────────────────────────────────────────────────────────
      - name: Build openssl-sys for aarch64
        working-directory: demo
        run: cargo build --target aarch64-unknown-linux-gnu -p openssl-sys --verbose
