name: Reproduce openssl-sys aarch64 failure

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  repro-openssl-sys-aarch64:
    runs-on: ubuntu-latest         # no self-hosted runner

    steps:
      - name: Install deps
        run: sudo apt -y install protobuf-compiler lld

      - name: aarch64 setup
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y gcc-multilib g++-multilib
          sudo apt install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

          mkdir -p .cargo
          touch .cargo/config
          printf '[target.aarch64-unknown-linux-gnu]\nlinker = "aarch64-linux-gnu-gcc"' >> .cargo/config

      - name: x86_64 setup
        run: |
          mkdir -p .cargo
          touch .cargo/config
          printf '[target.x86_64-unknown-linux-gnu]\nrustflags = ["-Clink-arg=-fuse-ld=lld"]' >> .cargo/config

      - name: Install & display rust toolchain
        run: rustup show

      - name: Add aarch64 target
        run: rustup target add ${{ matrix.target }}

      - name: Check targets are installed correctly
        run: rustup target list --installed


      # 3) minimal crate that depends only on openssl-sys
      - name: Create demo project
        run: |
          mkdir demo && cd demo
          cat > Cargo.toml <<'TOML'
          [package]
          name    = "openssl-sys-demo"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          openssl-sys = "0.9.108"
          TOML
          mkdir src && echo "fn main() {}" > src/main.rs

      # 4) attempt to build openssl-sys for aarch64
      - name: Build (expected to fail)
        working-directory: demo
        run: cargo build --target aarch64-unknown-linux-gnu -p openssl-sys --verbose
